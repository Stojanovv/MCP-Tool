spring.application.name=mcp-tool-backend

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.root=INFO
logging.level.mk.ukim.finki.mcptoolbackend=DEBUG
logging.level.org.springframework=WARN

logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

#jwt.secret=${JWT_SECRET_KEY}
jwt.secret=${JWT_SECRET_KEY:test-secret-key-please-override-in-real-runs}
jwt.expiration=864000000
jwt.header=Authorization
jwt.token-prefix=Bearer

vezilka.base-url=https://doniraj.vezilka.ai
vezilka.api-key=${VEZILKA_API_KEY:}

# MCP server (HTTP+SSE transport). The tools are reachable at /sse (stream) and
# /mcp/message (JSON-RPC). Connect the MCP Inspector or the Vezilka agent here.
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=vezilka-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# The specific Macedonian-resource website assigned to YOU.
# TODO(student): point these at your assigned site (set them in .env).
source.name=${SOURCE_NAME:example}
source.base-url=${SOURCE_BASE_URL:https://doniraj.vezilka.ai}
source.api-key=${SOURCE_API_KEY:}

spring.profiles.active=dev

